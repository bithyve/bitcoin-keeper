appId: io.hexawallet.keeper
---
- runFlow: setpin.yaml
- extendedWaitUntil:
    visible: "Welcome"
    timeout: 15000
- assertVisible:
    id: "view_startNewTile"
- tapOn:
    id: "view_startNewTile"
- extendedWaitUntil:
    visible: "Next"
    timeout: 30000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible:
      id: "view_wallet_0"
    timeout: 30000
