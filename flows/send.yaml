appId: ${APPID}
---
- runFlow: _common_open_wallet.yaml
- assertVisible:
    id: "btn_Send"
- tapOn:
    id: "btn_Send"
- runFlow: _common_handle_runtime_permissions.yaml
- assertVisible:
    id: "input_receive_address"
- tapOn:
    id: "input_receive_address"
- inputText: "tb1qq4yupzkhnzlz8kva9udnud6rw5vezk5qr7kp7s"
- assertVisible:
    id: "input_amount"
- tapOn:
    id: "input_amount"
- eraseText
- inputText: "0.00001100"
- tapOn:
    id: "input_note"
- inputText: "Maestro send flow"
- hideKeyboard
- tapOn:
    id: "btn_primaryText"
- runFlow:
    when:
      visible: "Insufficient balance"
    commands:
      - assertVisible: "Insufficient balance"
      - tapOn:
          id: "btn_back"
- runFlow:
    when:
      visible: "Sending to address"
    commands:
      - tapOn:
          id: "btn_primaryText"
      - assertVisible:
          id: "modal_passcode_verify"
      - runFlow: _common_enter_passcode_1111.yaml
      - tapOn:
          id: "btn_primaryText"
      - extendedWaitUntil:
          visible: "Send Successful"
          timeout: 30000
      - runFlow:
          when:
            visible: "View Details"
          commands:
            - tapOn: "View Details"
