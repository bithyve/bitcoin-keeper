appId: io.hexawallet.keeper
---
- tapOn:
    id: 'view_wallet_0'
    index: 0
- swipe:
    from:
      id: list_transactions
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'btn_Settings'
- tapOn:
    id: 'btn_Settings'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    id: 'btn_back'
- assertVisible: 'Wallet Settings'
- tapOn:
    id: 'btn_back'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'btn_back'
- waitForAnimationToEnd:
    timeout: 1000
