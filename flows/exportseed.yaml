appId: io.hexawallet.keeper
---
- runFlow:
    when:
      visible:
        id: "view_Export_app_individual_phrase"
    commands:
      - tapOn:
          id: "view_Export_app_individual_phrase"
- runFlow:
    when:
      visible:
        id: "btn_App_Backup"
    commands:
      - tapOn:
          id: "btn_App_Backup"
      - tapOn:
          id: "view_Export_app_individual_phrase"
- runFlow:
    when:
      visible: "Backup Wallet"
    commands:
      - tapOn: "Backup Wallet"
      - tapOn:
          id: "view_Export_app_individual_phrase"
- extendedWaitUntil:
    visible: "Confirm Passcode"
    timeout: 15000
- runFlow: _common_enter_passcode_1111.yaml
- runFlow:
    when:
      visible:
        id: "btn_primaryText"
    commands:
      - tapOn:
          id: "btn_primaryText"
- extendedWaitUntil:
    visible: "Recovery Phrase"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "btn_seed_word_0"
    commands:
      - tapOn:
          id: "btn_seed_word_0"
- runFlow:
    when:
      visible:
        id: "btn_back"
    commands:
      - tapOn:
          id: "btn_back"
      - tapOn:
          id: "btn_back"
