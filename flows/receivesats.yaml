appId: ${APPID}
---
- runFlow: _common_open_wallet.yaml
- tapOn:
    id: "btn_Settings"
- runFlow:
    when:
      visible:
        id: "view_Receive_Test_Sats"
    commands:
      - tapOn:
          id: "view_Receive_Test_Sats"
      - extendedWaitUntil:
          visible: "5000 Sats Received"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "btn_back"
    commands:
      - tapOn:
          id: "btn_back"
