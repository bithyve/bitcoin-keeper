appId: io.hexawallet.keeper
---
- tapOn:
    id: 'view_wallet_0'
    index: 0
- swipe:
    from:
      id: list_transactions
    direction: DOWN
    duration: 2000
- waitForAnimationToEnd:
    timeout: 5000
# Wait up to 60 s for any unconfirmed transactions to clear before buying
- extendedWaitUntil:
    notVisible:
      id: 'icon_unconfirmed_0'
    timeout: 60000
- assertVisible:
    id: 'btn_Buy Bitcoin'
- tapOn:
    id: 'btn_Buy Bitcoin'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'btn_primaryText'
- waitForAnimationToEnd:
    timeout: 2000
# Navigate back to home
- tapOn:
    id: 'btn_back'
- waitForAnimationToEnd:
    timeout: 1000

