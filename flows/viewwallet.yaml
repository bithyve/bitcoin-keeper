appId: io.hexawallet.keeper
---
# - runFlow: login.yaml
- tapOn:
    id: 'view_wallet_0'
# The first-run info modal may appear; dismiss it if visible
- runFlow:
    when:
      visible:
        id: 'btn_close_modal'
    commands:
      - assertVisible: 'Bip-85 Wallets'
      - assertVisible: 'See FAQs'
      - tapOn:
          id: 'btn_close_modal'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'btn_back'
- assertVisible:
    id: 'btn_learnMore'
- assertVisible:
    id: 'btn_Send'
- assertVisible:
    id: 'btn_Receive'
- assertVisible:
    id: 'btn_Buy'
- assertVisible:
    id: 'btn_Settings'
# Open and dismiss the learn-more modal
- tapOn:
    id: 'btn_learnMore'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: 'Bip-85 Wallets'
- tapOn:
    id: 'btn_close_modal'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'btn_back'
