appId: ${APPID}
---
- runFlow: _common_open_wallet.yaml
- tapOn:
    id: "btn_Receive"
- tapOn:
    id: "btn_copy_address"
- runFlow:
    when:
      visible: "Address Copied Successfully"
    commands:
      - assertVisible: "Address Copied Successfully"
- tapOn:
    id: "btn_back"
- tapOn:
    id: "btn_back"
