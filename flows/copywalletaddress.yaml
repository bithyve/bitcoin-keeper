appId: io.hexawallet.keeper
---
# - runFlow: login.yaml
- tapOn:
    id: 'view_wallet_0'
    index: 0
- tapOn:
    id: 'btn_Receive'
- tapOn:
    id: 'btn_copy_address'
- extendedWaitUntil:
    visible: 'Address Copied Successfully'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: 'btn_back'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'btn_back'
- waitForAnimationToEnd:
    timeout: 1000
