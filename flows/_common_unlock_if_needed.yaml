appId: ${APPID}
---
- runFlow:
    when:
      visible: "Enter your passcode"
    commands:
      - runFlow: _common_enter_passcode_1111.yaml
- runFlow:
    when:
      visible: "Proceed"
    commands:
      - tapOn: "Proceed"
- extendedWaitUntil:
    visible:
      id: "view_wallet_0"
    timeout: 30000
