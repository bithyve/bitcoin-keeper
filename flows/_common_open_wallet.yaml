appId: ${APPID}
---
- runFlow: _common_unlock_if_needed.yaml
- tapOn:
    id: "view_wallet_0"
    index: 0
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible:
        id: "list_transactions"
    commands:
      - swipe:
          from:
            id: "list_transactions"
          direction: DOWN
          duration: 1500
      - waitForAnimationToEnd:
          timeout: 3000
