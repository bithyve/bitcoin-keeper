appId: io.hexawallet.keeper
---
- runFlow: _common_unlock_if_needed.yaml
- runFlow:
    when:
      visible:
        id: "btn_choosePlan"
    commands:
      - tapOn:
          id: "btn_choosePlan"
- runFlow:
    when:
      visible: "Subscription"
    commands:
      - assertVisible: "Subscription"
- runFlow:
    when:
      visible:
        id: "btn_back"
    commands:
      - tapOn:
          id: "btn_back"
