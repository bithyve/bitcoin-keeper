# REVIEW ONLY: no execution authorized. First new-branch push would run once.
name: One-time frozen Ruby and Pod preparation - requires approval before push
permissions:
  contents: read
concurrency:
  group: keeper-one-time-native-prerequisite
  cancel-in-progress: false
env:
  CI: 'true'
  HUSKY: '0'
  KEEPER_SOURCE_SHA: bccb63348754e7a7975ea140717d31be214f0801
  MAESTRO_CLI_NO_ANALYTICS: '1'
  BUNDLE_RETRY: '0'
  KEEPER_POD_LOCK_REPAIR: '0'
jobs:
  ios:
    name: iOS dependency diagnosis
    if: ${{ github.repository == 'KeeperCommunity/bitcoin-keeper' && github.event_name == 'push' && github.ref == 'refs/heads/codex/native-workspace-literal-once-bccb6334'
      && github.event.repository.private == false && github.event.created == true && github.event.deleted == false && github.event.forced == false
      && github.run_attempt == 1 && github.sha == github.workflow_sha }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      KEEPER_NATIVE_PLATFORM: IOS
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
    - name: Check out exact app source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: bccb63348754e7a7975ea140717d31be214f0801
        persist-credentials: false
        repository: KeeperCommunity/bitcoin-keeper
        path: .
    - name: Check out pinned reviewed harness
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: KeeperCommunity/bitcoin-keeper
        ref: 0984c5b97e7e8326d6856ba662274ecf325e5e0f
        path: harness
        persist-credentials: false
    - name: Check out this reviewed runner
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: KeeperCommunity/bitcoin-keeper
        ref: ${{ github.workflow_sha }}
        path: review
        persist-credentials: false
        fetch-depth: 2
    - name: Move reviewed inputs outside application checkout
      run: |
        test ! -e "$RUNNER_TEMP/keeper-native-inputs"
        mkdir "$RUNNER_TEMP/keeper-native-inputs"
        mv "$GITHUB_WORKSPACE/harness" "$GITHUB_WORKSPACE/review" "$RUNNER_TEMP/keeper-native-inputs/"
    - name: Verify reviewed inputs and stage pinned harness
      run: python3 -B "$RUNNER_TEMP/keeper-native-inputs/review/review-only/keeper-native-validation/diagnose.py" stage
      env:
        KEEPER_PROVENANCE_TOKEN: ${{ github.token }}
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 22.22.0
        package-manager-cache: false
    - name: Set up Java for Maestro
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Ruby
      uses: ruby/setup-ruby@675dd7ba1b06c8786a1480d89c384f5620a42647
      with:
        ruby-version: 3.3.8
        bundler: 2.5.6
        bundler-cache: false
    - name: Record runner and toolchain
      run: python3 -B "$RUNNER_TEMP/keeper-native-inputs/review/review-only/keeper-native-validation/diagnose.py" record
      env:
        KEEPER_PROVENANCE_TOKEN: ${{ github.token }}
      id: record
    - name: Install immutable native dependencies
      run: python3 -B "$RUNNER_TEMP/keeper-native-inputs/review/review-only/keeper-native-validation/diagnose.py" prepare
      env:
        KEEPER_PROVENANCE_TOKEN: ${{ github.token }}
      id: prepare
      timeout-minutes: 24
defaults:
  run:
    shell: bash
    working-directory: .
'on':
  push:
    branches:
    - codex/native-workspace-literal-once-bccb6334
