name: Keeper independent Claude review

# Privileged workflow comes from sprint, never the PR's merge ref.
# synchronize catches documentation-only PRs that subsequently add code.
on:
  pull_request_target:
    branches: [sprint]
    types: [opened, reopened, ready_for_review, synchronize, edited]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  independent-review:
    name: Independent Claude code review
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/claude-review '))
    concurrency:
      group: keeper-claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      # Only eligible jobs enter the lock; preserve any in-flight paid request.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this environment to allow ONLY the sprint branch, no tags.
    # Store KEEPER_CLAUDE_API_KEY here; never use a repository-level key.
    environment: keeper-claude-review
    steps:
      - name: Checkout trusted reviewer only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # issue_comment uses the default branch's immutable event SHA.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Verify protected credential environment before secret use
        run: python3 -I .github/scripts/claude_review.py --check-environment
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Review immutable PR data with tool-free Claude Sonnet 5.5
        # No PR strings enter shell code. Only trusted Python reads the event.
        run: python3 -I .github/scripts/claude_review.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.KEEPER_CLAUDE_API_KEY }}
          KEEPER_CLAUDE_STATE_KEY: ${{ secrets.KEEPER_CLAUDE_STATE_KEY }}
