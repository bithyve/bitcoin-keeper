name: CI

on:
  push:
    branches:
      - sprint
      - dev
      - main
  pull_request:
    branches:
      - sprint
      - dev
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'

      # Root prepare invokes CocoaPods and writes a Mac SDK path; setup.sh can
      # mask the pod failure. Keep JavaScript CI installation explicit on Linux.
      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22 --ignore-scripts
          yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Apply repository dependency patches
        run: node_modules/.bin/patch-package --error-on-fail

      - name: Verify dependency inputs remain unchanged
        run: git diff --exit-code HEAD -- package.json yarn.lock ios/Podfile.lock

      - name: Run lint
        run: npm run lint
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'

      # Match the explicit JavaScript setup used by the lint job.
      - name: Install dependencies
        run: |
          npm install --global yarn@1.22.22 --ignore-scripts
          yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Apply repository dependency patches
        run: node_modules/.bin/patch-package --error-on-fail

      - name: Verify dependency inputs remain unchanged
        run: git diff --exit-code HEAD -- package.json yarn.lock ios/Podfile.lock

      - name: Run tests
        run: npm run test
