name: CI

on:
  push:
    branches:
      - sprint
      - dev
      - main
  pull_request:
    branches:
      - sprint
      - dev
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Run lint
        run: npm run lint
        continue-on-error: true

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Draft PRs must not invoke package.json prepare -> setup.sh -> CocoaPods.
      # Keep the normal required Tests job; install/test errors still fail it.
      - name: Install draft dependencies without lifecycle scripts
        if: github.event_name == 'pull_request' && toJSON(github.event.pull_request.draft) != 'false'
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        if: github.event_name != 'pull_request' || toJSON(github.event.pull_request.draft) == 'false'
        run: yarn install

      - name: Run tests
        run: npm run test
