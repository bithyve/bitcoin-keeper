name: Ingest Release Notes to RAG

on:
  release:
    types: [published]

jobs:
  ingest:
    name: Push release notes to RAG
    runs-on: ubuntu-latest

    steps:
      - name: Ingest release notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RAG_ADMIN_KEY: ${{ secrets.RAG_ADMIN_KEY }}

        run: |
          PAYLOAD=$(jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg body "$RELEASE_BODY" \
            --arg title "$RELEASE_NAME" \
            --arg version "$RELEASE_TAG" \
            '{
              content: ("Bitcoin Keeper " + $tag + "\n\n" + $body),
              title: $title,
              metadata: {
                type: "release_notes",
                version: $version
              }
            }')

          curl --fail --retry 3 --retry-delay 5 -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "admin-key: ${RAG_ADMIN_KEY}" \
            -d "$PAYLOAD" \
            https://relay.bitcoinkeeper.app/addRagChunk
