# Full packaged app, ordinary index.js/production reducers/sagas/Realm. PIN1111
# belongs only to the runner-created disposable installation. Never reveal seeds.
appId: ${APP_ID}
name: Full app startup first wallet and cold persistence
---
- runScript:
    file: product_metric.js
    env:
      STAGE: startup_start
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: Create a passcode
    timeout: 180000
- runScript:
    file: product_metric.js
    env:
      STAGE: startup_ready
- repeat:
    times: 4
    commands:
      - tapOn:
          id: key_1
- assertVisible: Confirm your passcode
- repeat:
    times: 4
    commands:
      - tapOn:
          id: key_1
- tapOn: Create
- extendedWaitUntil:
    visible: Continue
    timeout: 30000
- tapOn: Continue
- extendedWaitUntil:
    visible: Cancel
    timeout: 30000
- tapOn: Cancel
- extendedWaitUntil:
    visible:
      id: btn_skip
    timeout: 30000
- tapOn:
    id: btn_skip
- extendedWaitUntil:
    visible:
      id: view_startNewTile
    timeout: 30000
- runScript:
    file: product_metric.js
    env:
      STAGE: wallet_start
- tapOn:
    id: view_startNewTile
- extendedWaitUntil:
    visible: Next
    timeout: 180000
- runScript:
    file: product_metric.js
    env:
      STAGE: wallet_ready
- tapOn: Next
- extendedWaitUntil:
    visible: Protect Your Recovery Key
    timeout: 30000
- tapOn: Skip for Now
- extendedWaitUntil:
    visible: Continue Without Backup?
    timeout: 30000
- tapOn: Skip Backup
- extendedWaitUntil:
    visible:
      id: home_visible_wallet_count_1
    timeout: 30000
- assertVisible: Mobile Wallet
- runScript:
    file: product_metric.js
    env:
      STAGE: home_ready
- stopApp
- runScript:
    file: product_metric.js
    env:
      STAGE: relaunch_start
- launchApp
- extendedWaitUntil:
    visible: Enter your passcode
    timeout: 60000
- runScript:
    file: product_metric.js
    env:
      STAGE: relaunch_login
- repeat:
    times: 4
    commands:
      - tapOn:
          id: key_1
- tapOn: Proceed
- extendedWaitUntil:
    visible:
      id: home_visible_wallet_count_1
    timeout: 60000
- assertVisible: Mobile Wallet
- runScript:
    file: product_metric.js
    env:
      STAGE: relaunch_home
- tapOn:
    id: home_tab_more
- tapOn:
    id: home_tab_wallets
- extendedWaitUntil:
    visible:
      id: home_visible_wallet_count_1
    timeout: 30000
- assertVisible: Mobile Wallet
- runScript:
    file: product_metric.js
    env:
      STAGE: navigation_verified
- stopApp
